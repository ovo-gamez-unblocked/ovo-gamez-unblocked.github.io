<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>404 - Page Not Found</title><style>* {box-sizing: border-box;margin: 0;padding: 0;}html,body {width: 100%;min-height: 100%;}body {font-family: Arial, Helvetica, sans-serif;background: #0f1728;color: #ffffff;}.game-navbar {width: 100%;background: #172238;border-bottom: 1px solid rgba(255,255,255,0.08);}.game-navbar-inner {width: 100%;max-width: 1400px;margin: auto;padding: 14px 20px;display: flex;align-items: center;justify-content: space-between;gap: 20px;}.game-logo {color: #ffffff;text-decoration: none;font-size: 23px;font-weight: 800;white-space: nowrap;}.game-nav-links {display: flex;align-items: center;gap: 5px;overflow-x: auto;}.game-nav-links a {color: #bfc9da;text-decoration: none;padding: 9px 13px;border-radius: 8px;font-size: 14px;white-space: nowrap;transition: 0.2s ease;}.game-nav-links a:hover {background: #25344f;color: #ffffff;}.error-page {width: 100%;min-height: calc(100vh - 72px);display: flex;align-items: center;justify-content: center;padding: 50px 20px;}.error-content {width: 100%;max-width: 650px;text-align: center;}.error-number {font-size: clamp(110px, 20vw, 220px);line-height: 0.85;font-weight: 900;letter-spacing: -10px;background: linear-gradient(135deg,#7925f5,#a65cff);-webkit-background-clip: text;background-clip: text;color: transparent;margin-bottom: 25px;}.error-title {font-size: clamp(25px, 4vw, 38px);font-weight: 800;color: #ffffff;margin-bottom: 12px;}.error-description {max-width: 520px;margin: 0 auto 27px;color: #8f9db4;font-size: 15px;line-height: 1.7;}.error-actions {display: flex;justify-content: center;gap: 10px;flex-wrap: wrap;}.error-button {min-height: 45px;padding: 0 20px;display: inline-flex;align-items: center;justify-content: center;border-radius: 9px;text-decoration: none;font-size: 14px;font-weight: 700;transition: 0.2s ease;}.home-button {background: #7925f5;color: #ffffff;}.home-button:hover {background: #8b3cff;transform: translateY(-2px);}.browse-button {background: #1d2b44;color: #dce4f1;border: 1px solid rgba(255,255,255,0.08);}.browse-button:hover {background: #263653;color: #ffffff;transform: translateY(-2px);}.error-message {margin-top: 30px;color: #596981;font-size: 12px;}@media (max-width: 800px) {.game-navbar-inner {flex-direction: column;align-items: flex-start;}.game-nav-links {width: 100%;}.error-page {min-height: calc(100vh - 120px);padding: 40px 15px;}}@media (max-width: 500px) {.game-navbar-inner {padding: 12px 14px;}.game-logo {font-size: 20px;}.error-number {font-size: 120px;letter-spacing: -6px;margin-bottom: 20px;}.error-title {font-size: 25px;}.error-description {font-size: 14px;line-height: 1.6;}.error-actions {flex-direction: column;width: 100%;}.error-button {width: 100%;}}.error-button:focus-visible,.game-nav-links a:focus-visible,.game-logo:focus-visible {outline: 2px solid #ffffff;outline-offset: 3px;}</style></head><body><nav class="game-navbar"><div class="game-navbar-inner"><a href="/" class="game-logo">BasketBall Game</a></div></nav><main class="error-page"><div class="error-content"><div class="error-number">404</div><h1 class="error-title">You Found the Hidden Page!</h1><p class="error-description">Looks like this page went off the map.The game or page you are looking for may havebeen moved, removed, or never existed.</p><div class="error-actions"><a href="/" class="error-button home-button">Back to Home</a></div></div></main></body></html>
